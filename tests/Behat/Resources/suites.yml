# This plugin's own Behat suites. Sylius's suites are imported alongside these by behat.yml.dist, so
# every `sylius.behat.context.*` service below is one Sylius ships.

default:
    suites:
        # Admin UI: the plans a variant offers. Mirrors Sylius's own ui_managing_product_variants.
        ui_managing_subscription_plans:
            contexts:
                - sylius.behat.context.hook.doctrine_orm
                - sylius.behat.context.hook.session

                - sylius.behat.context.transform.channel
                - sylius.behat.context.transform.currency
                - sylius.behat.context.transform.lexical
                - sylius.behat.context.transform.locale
                - sylius.behat.context.transform.product
                - sylius.behat.context.transform.product_variant
                - sylius.behat.context.transform.shared_storage

                - sylius.behat.context.setup.admin_security
                - sylius.behat.context.setup.channel
                - sylius.behat.context.setup.currency
                - sylius.behat.context.setup.locale
                - sylius.behat.context.setup.product

                - sylius.behat.context.ui.admin.notification

                - jpm_martin_sylius_subscription.behat.context.setup.subscription_plan
                - jpm_martin_sylius_subscription.behat.context.ui.admin.managing_subscription_plans

            filters:
                tags: "@managing_subscription_plans&&@ui"

        # Admin UI: the subscriptions, their renewals and what can be done with them.
        ui_managing_subscription_frequencies:
            contexts:
                - sylius.behat.context.hook.doctrine_orm
                - sylius.behat.context.hook.session

                - sylius.behat.context.transform.channel
                - sylius.behat.context.transform.lexical
                - sylius.behat.context.transform.shared_storage

                - sylius.behat.context.setup.admin_security
                - sylius.behat.context.setup.channel

                - sylius.behat.context.ui.admin.notification

                - jpm_martin_sylius_subscription.behat.context.setup.subscription_frequency
                - jpm_martin_sylius_subscription.behat.context.ui.admin.managing_subscription_frequencies

            filters:
                tags: "@managing_subscription_frequencies&&@ui"

        # Admin UI: the "can be repeated" switch on the variant's subscription tab.
        ui_managing_repeatable_variants:
            contexts:
                - sylius.behat.context.hook.doctrine_orm
                - sylius.behat.context.hook.session

                - sylius.behat.context.transform.channel
                - sylius.behat.context.transform.lexical
                - sylius.behat.context.transform.product
                - sylius.behat.context.transform.product_variant
                - sylius.behat.context.transform.shared_storage

                - sylius.behat.context.setup.admin_security
                - sylius.behat.context.setup.channel
                - sylius.behat.context.setup.product

                - sylius.behat.context.ui.admin.notification

                - jpm_martin_sylius_subscription.behat.context.setup.subscription_frequency
                - jpm_martin_sylius_subscription.behat.context.ui.admin.managing_repeatable_variants

            filters:
                tags: "@managing_repeatable_variants&&@ui"

        ui_managing_subscriptions:
            contexts:
                - sylius.behat.context.hook.calendar
                - sylius.behat.context.hook.doctrine_orm
                - sylius.behat.context.hook.session

                - sylius.behat.context.transform.channel
                - sylius.behat.context.transform.currency
                - sylius.behat.context.transform.lexical
                - sylius.behat.context.transform.locale
                - sylius.behat.context.transform.payment
                - sylius.behat.context.transform.product
                - sylius.behat.context.transform.product_variant
                - sylius.behat.context.transform.shared_storage
                - sylius.behat.context.transform.shipping_method

                - sylius.behat.context.setup.admin_security
                - sylius.behat.context.setup.calendar
                - sylius.behat.context.setup.channel
                - sylius.behat.context.setup.currency
                - sylius.behat.context.setup.locale
                - sylius.behat.context.setup.payment
                - sylius.behat.context.setup.product
                - sylius.behat.context.setup.shipping

                - jpm_martin_sylius_subscription.behat.context.setup.subscription_plan
                - jpm_martin_sylius_subscription.behat.context.setup.subscription
                - jpm_martin_sylius_subscription.behat.context.ui.admin.managing_subscriptions
                - jpm_martin_sylius_subscription.behat.context.domain.processing_renewals

            filters:
                tags: "@managing_subscriptions&&@ui"

        # Shop UI: seeing a variant's plans and adding it to the cart once or by subscription.
        ui_subscribing_to_products:
            contexts:
                - sylius.behat.context.hook.doctrine_orm
                - sylius.behat.context.hook.session

                - sylius.behat.context.transform.channel
                - sylius.behat.context.transform.currency
                - sylius.behat.context.transform.lexical
                - sylius.behat.context.transform.locale
                - sylius.behat.context.transform.product
                - sylius.behat.context.transform.product_variant
                - sylius.behat.context.transform.shared_storage

                - sylius.behat.context.setup.channel
                - sylius.behat.context.setup.currency
                - sylius.behat.context.setup.locale
                - sylius.behat.context.setup.product

                - jpm_martin_sylius_subscription.behat.context.setup.subscription_plan
                - jpm_martin_sylius_subscription.behat.context.ui.shop.subscribing_to_products

            filters:
                tags: "@subscribing_to_products&&@ui"

        # Shop UI: repeating a whole cart with one of the store's frequencies.
        ui_repeating_a_cart:
            contexts:
                - sylius.behat.context.hook.doctrine_orm
                - sylius.behat.context.hook.guest_cart
                - sylius.behat.context.hook.session

                - sylius.behat.context.transform.cart
                - sylius.behat.context.transform.channel
                - sylius.behat.context.transform.lexical
                - sylius.behat.context.transform.product
                - sylius.behat.context.transform.product_variant
                - sylius.behat.context.transform.shared_storage

                - sylius.behat.context.setup.cart
                - sylius.behat.context.setup.channel
                - sylius.behat.context.setup.product

                - sylius.behat.context.ui.shop.cart

                - jpm_martin_sylius_subscription.behat.context.setup.subscription_frequency
                - jpm_martin_sylius_subscription.behat.context.ui.shop.repeating_a_cart

            filters:
                tags: "@repeating_a_cart&&@ui"

        # Shop UI: the customer's own subscriptions in their account.
        ui_managing_my_subscriptions:
            contexts:
                - sylius.behat.context.hook.calendar
                - sylius.behat.context.hook.doctrine_orm
                - sylius.behat.context.hook.session

                - sylius.behat.context.transform.channel
                - sylius.behat.context.transform.currency
                - sylius.behat.context.transform.lexical
                - sylius.behat.context.transform.locale
                - sylius.behat.context.transform.payment
                - sylius.behat.context.transform.product
                - sylius.behat.context.transform.product_variant
                - sylius.behat.context.transform.product_option_value
                - sylius.behat.context.transform.shared_storage
                - sylius.behat.context.transform.shipping_method

                - sylius.behat.context.setup.calendar
                - sylius.behat.context.setup.channel
                - sylius.behat.context.setup.currency
                - sylius.behat.context.setup.locale
                - sylius.behat.context.setup.payment
                - sylius.behat.context.setup.product
                - sylius.behat.context.setup.shipping
                - sylius.behat.context.setup.shop_security

                - jpm_martin_sylius_subscription.behat.context.setup.subscription_plan
                - jpm_martin_sylius_subscription.behat.context.setup.subscription
                - jpm_martin_sylius_subscription.behat.context.setup.subscription_frequency
                - jpm_martin_sylius_subscription.behat.context.ui.shop.managing_my_subscriptions
                - jpm_martin_sylius_subscription.behat.context.domain.processing_renewals

            filters:
                tags: "@managing_my_subscriptions&&@ui"

        # Shop UI: completing an order with subscriptions. Sylius's own ui_checkout contexts, plus the plugin's.
        ui_subscription_checkout:
            contexts:
                - sylius.behat.context.hook.doctrine_orm
                - sylius.behat.context.hook.guest_cart
                - sylius.behat.context.hook.mailer
                - sylius.behat.context.hook.session

                - sylius.behat.context.transform.address
                - sylius.behat.context.transform.cart
                - sylius.behat.context.transform.channel
                - sylius.behat.context.transform.country
                - sylius.behat.context.transform.currency
                - sylius.behat.context.transform.customer
                - sylius.behat.context.transform.lexical
                - sylius.behat.context.transform.locale
                - sylius.behat.context.transform.order
                - sylius.behat.context.transform.payment
                - sylius.behat.context.transform.product
                - sylius.behat.context.transform.product_variant
                - sylius.behat.context.transform.shared_storage
                - sylius.behat.context.transform.shipping_method
                - sylius.behat.context.transform.user
                - sylius.behat.context.transform.zone

                - sylius.behat.context.setup.address
                - sylius.behat.context.setup.cart
                - sylius.behat.context.setup.channel
                - sylius.behat.context.setup.checkout
                - sylius.behat.context.setup.checkout.address
                - sylius.behat.context.setup.checkout.payment
                - sylius.behat.context.setup.checkout.shipping
                - sylius.behat.context.setup.currency
                - sylius.behat.context.setup.customer
                - sylius.behat.context.setup.geographical
                - sylius.behat.context.setup.locale
                - sylius.behat.context.setup.payment
                - sylius.behat.context.setup.product
                - sylius.behat.context.setup.shipping
                - sylius.behat.context.setup.shop_security
                - sylius.behat.context.setup.user
                - sylius.behat.context.setup.zone

                - sylius.behat.context.ui.shop.cart
                - sylius.behat.context.ui.shop.checkout
                - sylius.behat.context.ui.shop.checkout.addressing
                - sylius.behat.context.ui.shop.checkout.complete
                - sylius.behat.context.ui.shop.checkout.payment
                - sylius.behat.context.ui.shop.checkout.shipping
                - sylius.behat.context.ui.shop.checkout.thank_you

                - jpm_martin_sylius_subscription.behat.context.setup.subscription_plan
                - jpm_martin_sylius_subscription.behat.context.setup.subscription_cart
                - jpm_martin_sylius_subscription.behat.context.setup.subscription_frequency
                - jpm_martin_sylius_subscription.behat.context.ui.shop.subscription_checkout
                - jpm_martin_sylius_subscription.behat.context.domain.subscription_consent

            filters:
                tags: "@subscription_checkout&&@ui"

        # Shop API: the same scenarios through the API. Sylius's own api_checkout contexts, plus the plugin's.
        api_subscription_checkout:
