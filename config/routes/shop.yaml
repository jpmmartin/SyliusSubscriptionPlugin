# The customer's subscriptions, under the shop's account path so the account's own access control
# covers them, and "Repeat this cart". A store imports this file the way it imports Sylius's shop
# routes: with the /{_locale} prefix and its requirement.

jpm_martin_sylius_subscription_shop_account_subscription_index:
    path: /account/subscriptions/
    methods: [GET]
    defaults:
        _controller: jpm_martin_sylius_subscription.controller.subscription::indexAction
        _sylius:
            section: shop_account
            template: "@JpmMartinSyliusSubscriptionPlugin/shop/account/subscription/index.html.twig"
            repository:
                method: findByCustomer
                arguments:
                    - "expr:service('sylius.context.customer').getCustomer()"

jpm_martin_sylius_subscription_shop_account_subscription_show:
    path: /account/subscriptions/{id}
    methods: [GET]
    defaults:
        _controller: jpm_martin_sylius_subscription.controller.subscription::showAction
        _sylius:
            section: shop_account
            template: "@JpmMartinSyliusSubscriptionPlugin/shop/account/subscription/show.html.twig"
            repository:
                method: findOneByIdAndCustomer
                arguments:
                    - $id
                    - "expr:service('sylius.context.customer').getCustomer()"

jpm_martin_sylius_subscription_shop_account_subscription_cancel:
    path: /account/subscriptions/{id}/cancel
    methods: [PUT]
    defaults:
        _controller: jpm_martin_sylius_subscription.controller.subscription::applyStateMachineTransitionAction
        _sylius:
            section: shop_account
            state_machine:
                graph: jpm_martin_sylius_subscription
                transition: cancel
            repository:
                method: findOneByIdAndCustomer
                arguments:
                    - $id
                    - "expr:service('sylius.context.customer').getCustomer()"
            redirect:
                route: jpm_martin_sylius_subscription_shop_account_subscription_show
                parameters:
                    id: $id
            flash: jpm_martin_sylius_subscription.subscription.cancelled

jpm_martin_sylius_subscription_shop_account_subscription_pause:
    path: /account/subscriptions/{id}/pause
    methods: [PUT]
    defaults:
        _controller: jpm_martin_sylius_subscription.controller.subscription::applyStateMachineTransitionAction
        _sylius:
            section: shop_account
            state_machine:
                graph: jpm_martin_sylius_subscription
                transition: pause
            repository:
                method: findOneByIdAndCustomer
                arguments:
                    - $id
                    - "expr:service('sylius.context.customer').getCustomer()"
            redirect:
                route: jpm_martin_sylius_subscription_shop_account_subscription_show
                parameters:
                    id: $id
            flash: jpm_martin_sylius_subscription.subscription.paused

jpm_martin_sylius_subscription_shop_account_subscription_resume:
    path: /account/subscriptions/{id}/resume
    methods: [PUT]
    defaults:
        _controller: jpm_martin_sylius_subscription.controller.subscription::applyStateMachineTransitionAction
        _sylius:
            section: shop_account
            state_machine:
                graph: jpm_martin_sylius_subscription
                transition: resume
            repository:
                method: findOneByIdAndCustomer
                arguments:
                    - $id
                    - "expr:service('sylius.context.customer').getCustomer()"
            redirect:
                route: jpm_martin_sylius_subscription_shop_account_subscription_show
                parameters:
                    id: $id
            flash: jpm_martin_sylius_subscription.subscription.resumed

jpm_martin_sylius_subscription_shop_account_subscription_skip_renewal:
    path: /account/subscriptions/{id}/skip-renewal
    methods: [POST]
    defaults:
        _controller: jpm_martin_sylius_subscription.controller.skip_subscription_renewal
        redirect_route: jpm_martin_sylius_subscription_shop_account_subscription_show
        customer_only: true

jpm_martin_sylius_subscription_shop_account_subscription_change_frequency:
    path: /account/subscriptions/{id}/change-frequency
    methods: [GET, POST]
    defaults:
        _controller: jpm_martin_sylius_subscription.controller.change_subscription_frequency
        template: "@JpmMartinSyliusSubscriptionPlugin/shop/account/subscription/change_frequency.html.twig"
        redirect_route: jpm_martin_sylius_subscription_shop_account_subscription_show
