    defaults:
        _controller: jpm_martin_sylius_subscription.controller.change_subscription_address
        template: "@JpmMartinSyliusSubscriptionPlugin/shop/account/subscription/change_address.html.twig"
        redirect_route: jpm_martin_sylius_subscription_shop_account_subscription_show
        customer_only: true

jpm_martin_sylius_subscription_shop_account_subscription_change_items:
    path: /account/subscriptions/{id}/change-items
    methods: [GET, POST]
    defaults:
        _controller: jpm_martin_sylius_subscription.controller.change_subscription_items
        template: "@JpmMartinSyliusSubscriptionPlugin/shop/account/subscription/change_items.html.twig"
