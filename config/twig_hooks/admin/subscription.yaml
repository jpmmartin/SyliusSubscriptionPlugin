# The subscriptions list and page are Sylius's shared CRUD pages. The page adds the actions its state
# allows to the header, and below it the details, the accepted consent, the products and the renewals
# with what each took in or skipped and every charge attempt. Changing the frequency has a page of its
# own, in the admin's layout.
sylius_twig_hooks:
    hooks:
        'sylius_admin.subscription.show.content.header.title_block':
            actions:
                template: '@JpmMartinSyliusSubscriptionPlugin/admin/subscription/show/actions.html.twig'
                priority: -100

        'sylius_admin.subscription.show.content':
            details:
                template: '@JpmMartinSyliusSubscriptionPlugin/admin/subscription/show/details.html.twig'
                priority: 50
            items:
                template: '@JpmMartinSyliusSubscriptionPlugin/admin/subscription/show/items.html.twig'
                priority: 45
            cycles:
                template: '@JpmMartinSyliusSubscriptionPlugin/admin/subscription/show/cycles.html.twig'
                priority: 40

        'jpm_martin_sylius_subscription.admin.subscription_frequency_change.update.content':
            header:
                template: '@JpmMartinSyliusSubscriptionPlugin/admin/subscription/change_frequency/header.html.twig'
                priority: 300
            form:
                template: '@JpmMartinSyliusSubscriptionPlugin/admin/subscription/change_frequency/form.html.twig'
                priority: 100
