# A subscription line says so in the cart, with a dropdown to change it when it has more than one option
# (choose-subscription-per-cart-line). Sylius's product cell has no hook of its own, so its hookable is replaced by
# one that renders the same component and adds that below it. "Repeat this cart" and the dropdown's own outside
# form are forms of their own, so they go after the cart's live form, not inside it.
sylius_twig_hooks:
    hooks:
        'sylius_shop.cart.index.content.form.sections.general.items.body':
            item:
                template: '@JpmMartinSyliusSubscriptionPlugin/shop/cart/index/items/body/item.html.twig'
                priority: 300

        'sylius_shop.cart.index.content':
            jpm_martin_sylius_subscription_repeat_cart:
                template: '@JpmMartinSyliusSubscriptionPlugin/shop/cart/index/repeat_cart.html.twig'
                priority: 50
            jpm_martin_sylius_subscription_cart_item_subscription_terms_form:
                template: '@JpmMartinSyliusSubscriptionPlugin/shop/cart/index/item_subscription_terms_form.html.twig'
                priority: 40
