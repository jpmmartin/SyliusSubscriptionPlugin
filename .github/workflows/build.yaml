name: Build

on:
    push:
        branches: [main]
        paths-ignore: ["**.md"]
    pull_request:
        paths-ignore: ["**.md"]
    workflow_dispatch: ~

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        runs-on: ubuntu-24.04

        name: "PHP ${{ matrix.php }}"

        strategy:
            fail-fast: false
            matrix:
                # The oldest PHP the plugin supports and a current one.
                php: ["8.2", "8.4"]

        env:
            APP_ENV: test
            # Overrides the value committed in tests/TestApplication/.env.test, which points at a
            # developer's own MySQL. A real environment variable wins over a dotenv file.
            DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/subscription_plugin_test?serverVersion=16&charset=utf8"

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_PASSWORD: postgres
                ports: ["5432:5432"]
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

        steps:
            - uses: actions/checkout@v5

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "${{ matrix.php }}"
                  extensions: intl, gd, opcache, pdo_pgsql, pgsql
                  tools: composer:v2
                  coverage: none

            - name: Set up Node
              uses: actions/setup-node@v5
              with:
                  node-version: "22.x"

            - name: Enable Yarn
              run: corepack enable

            - name: Cache Composer
              uses: actions/cache@v5
              with:
                  path: ~/.cache/composer/files
                  key: "${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}"
                  restore-keys: "${{ runner.os }}-php-${{ matrix.php }}-composer-"

            - name: Install dependencies
              run: composer install --no-interaction --no-progress --prefer-dist

            # Strict, and without --no-check-publish: this package is published, so the checks
            # that only matter for publishing are exactly the ones that matter.
            - name: Validate composer.json
              run: composer validate --ansi --strict

            - name: Check for known vulnerabilities
              run: composer audit --abandoned=ignore

            - name: Prepare the database
              run: |
                  vendor/bin/console doctrine:database:create --if-not-exists
                  vendor/bin/console doctrine:migrations:migrate --no-interaction

            # Without this no page renders: Sylius's layouts ask Encore for entries that only exist
            # once the test application has been built.
            - name: Build the front end
              run: composer frontend-clear

            - name: Run ECS
              run: vendor/bin/ecs check --no-progress-bar

            - name: Lint the container
              run: vendor/bin/console lint:container

            - name: Run PHPStan
              run: vendor/bin/phpstan analyse --no-progress

            - name: Run PHPUnit
              run: vendor/bin/phpunit --colors=always

            - name: Run Behat
              run: vendor/bin/behat --colors --strict --no-interaction -f progress --tags="~@javascript&&~@mink:chromedriver"

            - name: Upload Behat logs
              uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: "behat-logs-php${{ matrix.php }}"
                  path: etc/build/
                  if-no-files-found: ignore

    # The schema on the other engine Sylius supports. The jobs above build their database with the
    # plugin's migrations on PostgreSQL and run the whole suite; this one builds it on MySQL, takes
    # the plugin's migrations down and up again, and runs the tests that compare the tables the
    # migrations built with the ones the mapping describes. One set of migrations serves every
    # engine — Doctrine derives each engine's statements when it runs — and this job is what proves
    # it.
    schema-on-mysql:
        runs-on: ubuntu-24.04

        name: "Migrations on MySQL"

        env:
            APP_ENV: test
            DATABASE_URL: "mysql://root:root@127.0.0.1:3306/subscription_plugin_test?serverVersion=8.4&charset=utf8mb4"

        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: root
                ports: ["3306:3306"]
                options: >-
                    --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 20

        steps:
            - uses: actions/checkout@v5

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: intl, gd, opcache, pdo_mysql
                  tools: composer:v2
                  coverage: none

            - name: Cache Composer
              uses: actions/cache@v5
              with:
                  path: ~/.cache/composer/files
                  key: "${{ runner.os }}-php-8.4-composer-${{ hashFiles('composer.json') }}"
                  restore-keys: "${{ runner.os }}-php-8.4-composer-"

            - name: Install dependencies
              run: composer install --no-interaction --no-progress --prefer-dist

            # Before anything asks the server a question: MySQL refuses a connection to a database
            # that does not exist yet, where PostgreSQL would only have refused the query.
            - name: Create the database
              run: vendor/bin/console doctrine:database:create --if-not-exists

            - name: Which platform DBAL picked
              run: |
                  vendor/bin/console dbal:run-sql "SELECT VERSION()"
                  php -r 'require "vendor/autoload.php"; $_SERVER["APP_ENV"] = $_ENV["APP_ENV"] = "test"; require "vendor/sylius/test-application/config/bootstrap.php"; $kernel = new Sylius\TestApplication\Kernel("test", false); $kernel->boot(); echo get_class($kernel->getContainer()->get("doctrine.dbal.default_connection")->getDatabasePlatform()), PHP_EOL;'

            # Nothing of the plugin's may be skipped on this engine.
            - name: Build the schema with the migrations
              run: |
                  set -o pipefail
                  vendor/bin/console doctrine:migrations:migrate --no-interaction | tee migrate.log
                  ! grep -i 'JpmMartin' migrate.log | grep -qi skipped

            - name: Take the plugin's migrations down and up again
              run: composer migrations-roundtrip

            - name: The tables the migrations built are the ones the mapping describes
              run: vendor/bin/phpunit tests/Integration/Migrations --colors=always
